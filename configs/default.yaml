seed: 42
data:
  n_train: 256
  n_test: 128
  height: 8
  width: 8
  channels: 1
  n_classes: 4
  noise: 0.05
model:
  width: 8
train:
  epochs: 25
  lr: 0.15
  batch_size: 32
quantize:
  bits: 8
  # Weight-range PTQ observers (teaching stub — fake-quant, not TensorRT calibrators).
  # minmax | percentile
  observer: minmax
  percentile: 99.0
  # Leave matching weight tensors in float (substring match on names: stem_w, dw_w, pw_w, fc_w).
  # Example: [fc] keeps the classifier head float (selective / skip-sensitive-layers pattern).
  skip: []
  # Round 4: per_tensor (one scale/zp per weight tensor) | per_channel (one per
  # output channel, axis 0). Applies to the configured PTQ row, compose and QAT.
  granularity: per_tensor
  # Report extras: int4 rows (makes the granularity gap visible on a toy),
  # per-layer weight-quant error table, and a function-preserving depthwise
  # outlier stress test (channel 0 ×factor, pointwise input ÷factor; 0 = off).
  int4_rows: true
  error_table: true
  dw_outlier_factor: 64
prune:
  sparsity: 0.5
# Ordered compression pipeline for the compose eval row (prune → int8 fake-quant).
# Community recipes often prefer prune-then-quantize; order matters for sparsity + size.
compose:
  order: [prune, quantize]
# Knowledge distillation (teacher → thinner student). Teaching stub — not production KD.
distill:
  enabled: true
  temperature: 2.0
  alpha: 0.7
  student_width: 4
  teacher_epochs: 12
  epochs: 8
# Fake-quant QAT (prepare → few steps → convert). Compare against PTQ in the report.
qat:
  enabled: true
  steps: 12
  lr: 0.05
